services:
  dashboard:
    build: .
    image: ai-cloud-allocator:latest
    container_name: ai-cloud-allocator
    ports:
      - "8501:8501"
    environment:
      # app_v3.py = easy dashboard (dark mode), app_v2.py = earlier easy version, app.py = full technical dashboard
      APP_FILE: app_v3.py
    restart: unless-stopped
